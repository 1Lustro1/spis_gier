name: Zbuduj APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache buildozer
        uses: actions/cache@v5
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Zainstaluj zależności
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip
          pip install "buildozer==1.5.0" "cython==0.29.36" "setuptools<70"

      - name: Buduj APK
        shell: bash
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee build.log

      - name: Pokaż przyczynę błędu
        if: failure()
        shell: bash
        run: |
          echo "=========== NAJWAŻNIEJSZE BŁĘDY ==========="
          grep -n -iE "error:|error [0-9]|exception|traceback|fatal|failed" build.log \
            | grep -v -E "Dependency for .* not resolved" | tail -n 60 || true
          echo "=========== OSTATNIE LINIE PRZED 'Command failed' ==========="
          n=$(grep -n "Command failed" build.log | tail -n 1 | cut -d: -f1)
          if [ -n "$n" ]; then sed -n "$((n-80)),$((n))p" build.log; fi

      - name: Zapisz pełny log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: build.log

      - name: Udostępnij APK
        uses: actions/upload-artifact@v5
        with:
          name: SpisGier-apk
          path: bin/*.apk
