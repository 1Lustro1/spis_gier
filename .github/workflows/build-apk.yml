name: Zbuduj APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache buildozer
        uses: actions/cache@v5
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Zainstaluj zależności
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip
          pip install "buildozer==1.5.0" "cython==0.29.36" "setuptools<70"

      - name: Buduj APK
        shell: bash
        run: |
          set -o pipefail
          # licencja SDK akceptowana przez android.accept_sdk_license = True w buildozer.spec
          buildozer -v android debug < /dev/null 2>&1 | tee build.log
          ls -la bin/

      - name: Pokaż przyczynę błędu
        if: failure()
        shell: bash
        run: |
          sed -r 's/\x1B\[[0-9;]*[A-Za-z]//g' build.log > clean.log || true
          {
            echo "## Przyczyna błędu"
            echo '```'
            grep -iE "error:|error [0-9]|traceback|fatal|failed|not found|what went wrong" clean.log \
              | grep -v -E "Dependency for .* not resolved|Py_UNICODE|ENVIRONMENT|clang-14: error|first build failed" \
              | tail -n 40 || true
            echo '```'
            echo "## Ostatnie linie przed 'Command failed'"
            echo '```'
            n=$(grep -n "Command failed" clean.log | tail -n 1 | cut -d: -f1)
            if [ -n "$n" ]; then s=$(( n > 60 ? n - 60 : 1 )); sed -n "${s},${n}p" clean.log; else tail -n 60 clean.log; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY" || true

      - name: Zapisz pełny log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-log
          path: build.log

      - name: Udostępnij APK
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: SpisGier-apk
          path: bin/*.apk
          if-no-files-found: warn
